<!doctype html><html lang="en"><body>
<form>
  <label for="name">Full name *</label><input id="name" name="name" required>
  <label for="bio">Short bio</label><textarea id="bio" name="bio"></textarea>
  <label for="contact">Preferred contact *</label><select id="contact" name="contact" required>
    <option value="">Choose</option><option value="email">email</option>
    <option value="phone">phone</option><option value="post">post</option>
  </select>
  <fieldset><legend>Topics</legend>
    <label><input type="checkbox" name="topics" value="news">news</label>
    <label><input type="checkbox" name="topics" value="events">events</label>
    <label><input type="checkbox" name="topics" value="offers">offers</label>
  </fieldset>
  <fieldset aria-required="true"><legend>Subscribe?</legend>
    <label><input type="radio" name="subscribe" value="yes">yes</label>
    <label><input type="radio" name="subscribe" value="no">no</label>
  </fieldset>
  <label for="avatar">Avatar file</label><input id="avatar" name="avatar" type="file">
  <button type="button">Save (partial)</button><button type="submit">Submit answers</button>
</form>
</body></html>
